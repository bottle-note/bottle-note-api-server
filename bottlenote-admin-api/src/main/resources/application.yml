# 기본 서버 설정
app: # 애플리케이션 및 배포 정보
  type: admin
  cors:
    allowed-origins:
      - http://localhost:5173
      - https://bottle-note.github.io
    docs-allowed-origins:
      - https://bottle-note.github.io
  info:
    server-name: ${SERVER_NAME:unknown}
    environment: ${SPRING_PROFILES_ACTIVE:local}
    git-branch: ${GIT_BRANCH:unknown}
    git-commit: ${GIT_COMMIT:unknown}
    git-build-time: ${BUILD_TIME:unknown}
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /admin/api
    encoding:
      charset: UTF-8
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  tomcat:
    threads:
      max: 15
    max-connections: 20
    connection-timeout: 5000

spring:
  profiles:
    include:
      - datasource
      - external
  jackson:
    time-zone: Asia/Seoul

bottlenote:
  access-control:
    # 전역 spring.data.redis.timeout(15s)과 분리 — Redis 장애 시 요청 스레드 점유 상한
    redis-command-timeout: 200ms
    enabled: true
    fail-open: true
    key-namespace: admin
    default-rate-limit:
      limit: 300
      window-seconds: 60
    unknown-ip-rate-limit:
      limit: 20
      window-seconds: 60
    path-rules:
      - path-prefix: /v1/auth
        limit: 30
        window-seconds: 60
    # self-lockout 탈출: ban/RL 모두 스킵 (관리 평면)
    management-path-prefixes:
      - /v1/access-control
    excluded-path-prefixes:
      - /actuator
      - /v1/openapi.admin.json

# Spring Security
security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration: 86400 # 하루 (24시간)
    refresh-token-expiration: 2592000 # 한 달 (30일)
  nonce:
    salt: ${NONCE_SALT:bottle-note-secure-salt-2024}
apple:
  bundle-id: "com.bottlenote.official.app"

# admin은 카카오 로그인을 쓰지 않지만 mono의 KakaoAuthService가 컴포넌트 스캔에 걸려 빈으로 생성된다.
# apple.bundle-id가 여기 있는 것과 같은 이유다.
kakao:
  app-id: ${KAKAO_APP_ID}

# 기본 로깅 설정
logging:
  level:
    root: info

# OTEL 비활성화
management:
  tracing:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false

schedules:
  history:
    view:
      sync:
        enable: false

alcohol:
  lookup:
    local-cache:
      enabled: ${ALCOHOL_LOOKUP_LOCAL_CACHE_ENABLED:true}
      version-check-interval-ms: ${ALCOHOL_LOOKUP_LOCAL_CACHE_VERSION_CHECK_INTERVAL_MS:1000}
    # 전역 spring.data.redis.timeout(15s)은 유지하고 룩업 읽기만 fail-fast
    redis:
      read-timeout: 2s
    db-fallback:
      result-ttl: 30s
      circuit-failure-threshold: 3
      circuit-open-duration: 30s

curation:
  spec-sync:
    enabled: ${CURATION_SPEC_SYNC_ENABLED:true}

root:
  admin:
    email: ${ROOT_ADMIN_EMAIL:email@email.com}
    password: ${ROOT_ADMIN_PASSWORD}

# OpenAPI JSON은 context-path와 합쳐 /admin/api/v1/openapi.admin.json으로 노출한다
springdoc:
  api-docs:
    path: /v1/openapi.admin.json
  swagger-ui:
    enabled: false
  default-produces-media-type: application/json

--- # default/local 프로파일 (동일 설정)
spring:
  config:
    activate:
      on-profile: default,local
logging:
  level:
    root: info
    app.bottlenote: info
management:
  tracing:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false
server:
  tomcat:
    threads:
      max: 15
    max-connections: 20
    connection-timeout: 5000

--- # debug 프로파일 (디버그 로그만, SQL 로깅 없음)
spring:
  config:
    activate:
      on-profile: debug

logging:
  level:
    root: debug
    app.bottlenote: debug
    org.springframework: debug
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off

management:
  tracing:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false

server:
  tomcat:
    threads:
      max: 15
    max-connections: 20
    connection-timeout: 5000

--- # dev 프로파일 (개발 서버)
app:
  cors:
    allowed-origins:
      - https://admin.development.bottle-note.com
      - http://localhost:5173
      - https://bottle-note.github.io

spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: info
    app.bottlenote: info

management:
  tracing:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false

server:
  tomcat:
    threads:
      max: 100
    max-connections: 500
    connection-timeout: 30000

--- # prod 프로파일 (운영 서버)
app:
  cors:
    allowed-origins:
      - https://admin.bottle-note.com
      - https://bottle-note.github.io

spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: info
    app.bottlenote: info

management:
  tracing:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false

server:
  tomcat:
    threads:
      max: 100
    max-connections: 500
    connection-timeout: 30000

--- # lookup-perf 프로파일 (로컬 성능 검증 전용)
spring:
  config:
    activate:
      on-profile: lookup-perf

server:
  tomcat:
    threads:
      max: ${LOOKUP_PERF_TOMCAT_THREADS_MAX:64}
    max-connections: ${LOOKUP_PERF_TOMCAT_MAX_CONNECTIONS:512}
    connection-timeout: ${LOOKUP_PERF_TOMCAT_CONNECTION_TIMEOUT:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
