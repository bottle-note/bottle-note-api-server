# access-control Security chain 통합 테스트 전용 프로필
# application-test.yml의 enabled=false 기본값은 유지하고, 이 프로필 활성 시에만 켠다.
bottlenote:
  access-control:
    enabled: true
    fail-open: true
    key-namespace: admin-ac-it
    redis-command-timeout: 200ms
    default-rate-limit:
      limit: 3
      window-seconds: 60
    unknown-ip-rate-limit:
      limit: 2
      window-seconds: 60
    path-rules: []
    management-path-prefixes:
      - /v1/access-control
