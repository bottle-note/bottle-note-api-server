# 기본 서버 설정

app: # 애플리케이션 및 배포 정보
  type: product
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - https://bottle-note.github.io
    docs-allowed-origins:
      - https://bottle-note.github.io
  info:
    server-name: ${SERVER_NAME:unknown}
    environment: ${SPRING_PROFILES_ACTIVE:local}
    git-branch: ${GIT_BRANCH:unknown}
    git-commit: ${GIT_COMMIT:unknown}
    git-build-time: ${BUILD_TIME:unknown}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  tomcat:
    threads:
      max: 15
    max-connections: 20
    connection-timeout: 5000

spring:
  profiles:
    include:
      - datasource
      - external
      - observability
  jackson:
    time-zone: Asia/Seoul

  # Quartz 설정 (ViewHistorySyncJob 클러스터링)
  quartz:
    overwrite-existing-jobs: true
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: bottle_note_product_quartz_scheduler
            instanceId: AUTO
          threadPool:
            threadCount: 5
            threadPriority: 5
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            isClustered: true
            clusterCheckinInterval: 20000

bottlenote:
  observability:
    visitor-telemetry:
      enabled: false
  pagination:
    cursor:
      current-key-id: v1
      current-secret: ${PAGINATION_CURSOR_SECRET:pagination-cursor-secret}
      previous-key-id: ${PAGINATION_CURSOR_PREVIOUS_KEY_ID:}
      previous-secret: ${PAGINATION_CURSOR_PREVIOUS_SECRET:}
  # 앱 레이어 IP ban + rate limit (Redis 공유, multi-pod)
  access-control:
    enabled: true
    fail-open: true
    # 전역 spring.data.redis.timeout(15s)과 분리 — Redis 장애 시 요청 스레드 점유 상한
    redis-command-timeout: 200ms
    key-namespace: product
    default-rate-limit:
      # 공유 NAT·홈 피드 병렬 호출 오탐을 줄이기 위해 여유 있게 시작 후 메트릭으로 조인다
      limit: 600
      window-seconds: 60
    unknown-ip-rate-limit:
      limit: 30
      window-seconds: 60
    path-rules:
      - path-prefix: /api/v2/auth
        limit: 30
        window-seconds: 60
      # explore는 긴 prefix로 유지 (기존 longest-prefix 계약)
      - path-prefix: /api/v1/reviews/explore
        limit: 600
        window-seconds: 60
      # review 읽기/쓰기 한도는 method별 별도 Redis 버킷
      - path-prefix: /api/v1/reviews
        methods: [GET]
        limit: 600
        window-seconds: 60
      - path-prefix: /api/v1/reviews
        methods: [POST, PATCH, DELETE]
        limit: 60
        window-seconds: 60
    excluded-path-prefixes:
      - /actuator
      - /favicon.ico
      - /api/v1/openapi.product.json

# OpenAPI 문서 (스펙 JSON만 노출하고 swagger-ui는 사용하지 않는다)
# ingress가 /api/v*/** 만 앱으로 넘기므로 스펙 경로도 그 아래에 둔다
springdoc:
  api-docs:
    path: /api/v1/openapi.product.json
  swagger-ui:
    enabled: false
  # 응답은 모두 JSON이므로 @Content마다 미디어 타입을 적지 않는다
  default-produces-media-type: application/json

# Spring Security
security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration: 86400 # 하루 (24시간)
    refresh-token-expiration: 2592000 # 한 달 (30일)
  nonce:
    salt: ${NONCE_SALT:bottle-note-secure-salt-2024}

apple:
  bundle-id: "com.bottlenote.official.app"

kakao:
  app-id: ${KAKAO_APP_ID}

# Webhook 설정
webhook:
  discord:
    url: ${DISCORD_WEBHOOK_URL:}

# 기본 로깅 설정
logging:
  level:
    root: info

schedules:
  alcohol:
    lookup:
      sync:
        enable: true
        cron: "0 */5 * * * *"
  history:
    view:
      sync:
        enable: true

alcohol:
  lookup:
    local-cache:
      enabled: ${ALCOHOL_LOOKUP_LOCAL_CACHE_ENABLED:true}
      version-check-interval-ms: ${ALCOHOL_LOOKUP_LOCAL_CACHE_VERSION_CHECK_INTERVAL_MS:1000}

--- # default/local 프로파일 (동일 설정)
spring:
  config:
    activate:
      on-profile: default,local
  graphql:
    graphiql:
      enabled: false
      path: /graphiql

logging:
  level:
    root: info
    app.bottlenote: info

server:
  tomcat:
    threads:
      max: 15
    max-connections: 20
    connection-timeout: 5000

--- # debug 프로파일 (디버그 로그만, SQL 로깅 없음)
spring:
  config:
    activate:
      on-profile: debug

logging:
  level:
    root: debug
    app.bottlenote: debug
    org.springframework: debug
    # SQL 로깅 비활성화
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off

server:
  tomcat:
    threads:
      max: 15
    max-connections: 20
    connection-timeout: 5000

--- # dev 프로파일 (개발 서버)
app:
  cors:
    allowed-origins:
      - https://development.bottle-note.com
      - http://localhost:3000
      - http://localhost:5173
      - https://bottle-note.github.io

spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: info
    app.bottlenote: info

server:
  tomcat:
    threads:
      max: 200
    max-connections: 2000
    connection-timeout: 30000

--- # prod 프로파일 (운영 서버)
app:
  cors:
    allowed-origins:
      - https://bottle-note.com
      - https://bottle-note.github.io

spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: info
    app.bottlenote: info

server:
  tomcat:
    threads:
      max: 200
    max-connections: 2000
    connection-timeout: 30000

--- # lookup-perf 프로파일 (로컬 성능 검증 전용)
spring:
  config:
    activate:
      on-profile: lookup-perf

server:
  tomcat:
    threads:
      max: ${LOOKUP_PERF_TOMCAT_THREADS_MAX:64}
    max-connections: ${LOOKUP_PERF_TOMCAT_MAX_CONNECTIONS:512}
    connection-timeout: ${LOOKUP_PERF_TOMCAT_CONNECTION_TIMEOUT:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

--- # VisitorTelemetry 활성 프로파일
spring:
  config:
    activate:
      on-profile: local,dev,prod

bottlenote:
  observability:
    visitor-telemetry:
      enabled: true
