// bottlenote-product-api
dependencies {
	implementation project(':bottlenote-mono')
	testImplementation project(':bottlenote-test-support')
	implementation project(':bottlenote-observability')

	// ===== Spring Boot Web  =====
	implementation libs.spring.boot.starter.web
	implementation libs.spring.boot.starter.validation
	implementation libs.spring.boot.starter.data.jpa

	// OpenAPI 스펙 생성 (swagger-ui는 설정으로 비활성)
	implementation libs.springdoc.openapi.starter.webmvc.ui

	// Test - Lombok
	testAnnotationProcessor libs.lombok

	// Test - Database
	testImplementation libs.spring.boot.starter.data.jpa
	testImplementation libs.spring.boot.starter.data.redis
	testImplementation libs.hypersistence.utils
	testImplementation libs.mysql.connector.j

	// Test - QueryDSL
	testImplementation libs.querydsl.jpa
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${libs.versions.querydsl.get()}:jakarta"
	annotationProcessor libs.jakarta.annotation.api
	annotationProcessor libs.jakarta.persistence.api

	// JWT
	implementation libs.bundles.jwt.complete
	implementation libs.google.guava

	// Security
	implementation libs.spring.boot.starter.security
	implementation libs.spring.security.test
	testImplementation libs.spring.security.test
	testImplementation libs.mockito.inline

	// Test - TestContainers
	testImplementation libs.bundles.testcontainers.complete

	// Schema migration
	runtimeOnly libs.flyway.core
	runtimeOnly libs.flyway.mysql

	// Test - ArchUnit
	testImplementation libs.archunit

	// Test - AWS
	testImplementation platform(libs.aws.sdk.bom)
	testImplementation libs.aws.sdk.s3

	// Test - Feign
	testImplementation libs.spring.cloud.starter.openfeign
}

bootJar {
	enabled = true
	archiveFileName = 'bottlenote-product-api.jar'
}

jar {
	enabled = true
}

sourceSets {
	main {
		resources {
			srcDirs = ['src/main/resources']
		}
	}
	test {
		resources {
			srcDirs = ['src/test/resources']
		}
	}
}

tasks.named('processResources') {
	from("${rootProject.projectDir}/git.environment-variables/storage/db/migration") {
		include '*.sql'
		into 'db/migration'
	}
}

tasks.register("prepareKotlinBuildScriptModel") {}
