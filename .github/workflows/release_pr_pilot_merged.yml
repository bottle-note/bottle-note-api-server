name: release PR deployment

on:
  pull_request:
    types: [closed]
    branches:
      - 'releases/**'

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  verify-merged-empty-release-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-key: ${{ steps.release.outputs.release-key }}
      source-sha: ${{ steps.release.outputs.source-sha }}
      deployment-mode: ${{ steps.release.outputs.deployment-mode }}
      release-branch: ${{ steps.release.outputs.release-branch }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: verify release PR
        id: release
        shell: bash
        run: |
          set -euo pipefail

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::invalid PR number"
            exit 1
          }
          [[ "$PR_BASE_REF" =~ ^releases/([0-9]{4}-[0-9]{2}-[0-9]{2})/([1-9][0-9]*)$ ]] || {
            echo "::error::base ref is not a release ref: $PR_BASE_REF"
            exit 1
          }
          release_date="${BASH_REMATCH[1]}"
          sequence="${BASH_REMATCH[2]}"
          release_key="${release_date}/${sequence}"
          expected_base="releases/${release_key}"
          expected_head="main"
          [[ "$PR_BASE_REF" == "$expected_base" ]] || {
            echo "::error::base ref does not match derived release key"
            exit 1
          }
          [[ "$PR_HEAD_REF" == "$expected_head" ]] || {
            echo "::error::head ref must exactly match ${expected_head}"
            exit 1
          }
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::invalid main head SHA"
            exit 1
          }
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::invalid release base SHA"
            exit 1
          }
          [[ "$PR_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::invalid merge SHA"
            exit 1
          }
          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")" || {
            echo "::error::unable to retrieve PR metadata"
            exit 1
          }
          pr_values_text="$(PR_JSON="$pr_json" REPOSITORY="$REPOSITORY" \
            PR_NUMBER="$PR_NUMBER" PR_BASE_REF="$PR_BASE_REF" PR_HEAD_REF="$PR_HEAD_REF" \
            PR_BASE_SHA="$PR_BASE_SHA" PR_HEAD_SHA="$PR_HEAD_SHA" PR_MERGE_SHA="$PR_MERGE_SHA" \
            EXPECTED_BASE="$expected_base" EXPECTED_HEAD="$expected_head" python3 - <<'PY'
          import json
          import os
          import sys

          pr = json.loads(os.environ['PR_JSON'])
          expected_number = int(os.environ['PR_NUMBER'])
          expected_base = os.environ['EXPECTED_BASE']
          expected_head = os.environ['EXPECTED_HEAD']
          errors = []
          if ((pr.get('head') or {}).get('repo') or {}).get('full_name') != os.environ['REPOSITORY']:
              errors.append('PR head repository is not this repository')
          if ((pr.get('base') or {}).get('repo') or {}).get('full_name') != os.environ['REPOSITORY']:
              errors.append('PR base repository is not this repository')
          if pr.get('number') != expected_number:
              errors.append('API PR number does not match event PR number')
          if ((pr.get('head') or {}).get('ref')) != os.environ['PR_HEAD_REF'] or os.environ['PR_HEAD_REF'] != expected_head:
              errors.append('API/event/expected head ref mismatch')
          if ((pr.get('head') or {}).get('sha')) != os.environ['PR_HEAD_SHA']:
              errors.append('API head SHA does not match event head SHA')
          if ((pr.get('base') or {}).get('ref')) != os.environ['PR_BASE_REF'] or os.environ['PR_BASE_REF'] != expected_base:
              errors.append('API/event/expected base ref mismatch')
          if ((pr.get('base') or {}).get('sha')) != os.environ['PR_BASE_SHA']:
              errors.append('API base SHA does not match event base SHA')
          if pr.get('merge_commit_sha') != os.environ['PR_MERGE_SHA']:
              errors.append('API merge SHA does not match event merge SHA')
          if errors:
              for error in errors:
                  print(f'::error::{error}', file=sys.stderr)
              sys.exit(1)
          for field in ('changed_files', 'additions', 'deletions'):
              print(pr.get(field))
          PY
          )" || {
            echo "::error::PR API metadata validation failed closed"
            exit 1
          }
          readarray -t pr_values <<< "$pr_values_text"
          changed_files="${pr_values[0]:-}"
          additions="${pr_values[1]:-}"
          deletions="${pr_values[2]:-}"
          [[ "$changed_files" == "0" && "$additions" == "0" && "$deletions" == "0" ]] || {
            echo "::error::release PR must contain no file changes (changed_files=${changed_files}, additions=${additions}, deletions=${deletions})"
            exit 1
          }

          pr_body="$(PR_JSON="$pr_json" python3 - <<'PY'
          import json
          import os
          print(json.loads(os.environ['PR_JSON']).get('body') or '')
          PY
          )"
          release_values_text="$(PR_BODY="$pr_body" EXPECTED_KEY="$release_key" python3 - <<'PY'
          import os
          import re
          import sys

          body = os.environ['PR_BODY']
          expected_key = os.environ['EXPECTED_KEY']
          source_markers = re.findall(r'<!--\s*release-source-sha:([0-9a-f]{40})\s*-->', body)
          key_markers = re.findall(r'<!--\s*release-key:([0-9]{4}-[0-9]{2}-[0-9]{2}/[1-9][0-9]*)\s*-->', body)
          mode_markers = re.findall(r'<!--\s*release-deployment-mode:(both|product|admin)\s*-->', body)
          if len(source_markers) != 1 or len(key_markers) != 1 or len(mode_markers) != 1:
              print('::error::PR body must contain exactly one source SHA, key, and deployment mode marker', file=sys.stderr)
              sys.exit(1)
          if key_markers[0] != expected_key:
              print('::error::PR body release key marker does not match refs', file=sys.stderr)
              sys.exit(1)
          print(source_markers[0])
          print(mode_markers[0])
          PY
          )"
          readarray -t release_values <<< "$release_values_text"
          source_sha="${release_values[0]:-}"
          deployment_mode="${release_values[1]:-}"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::invalid source SHA marker"
            exit 1
          }
          [[ "$deployment_mode" =~ ^(both|product|admin)$ ]] || {
            echo "::error::invalid deployment mode marker"
            exit 1
          }
          [[ "$source_sha" == "$PR_HEAD_SHA" ]] || {
            echo "::error::source SHA marker must equal the merged main head SHA"
            exit 1
          }

          git fetch --no-tags origin "$PR_BASE_SHA" "$source_sha" "$PR_MERGE_SHA"
          git cat-file -e "${source_sha}^{commit}" || {
            echo "::error::source SHA is not a commit"
            exit 1
          }
          git cat-file -e "${PR_HEAD_SHA}^{commit}" || {
            echo "::error::main release SHA is not a commit"
            exit 1
          }
          git cat-file -e "${PR_MERGE_SHA}^{commit}" || {
            echo "::error::merge SHA is not a commit"
            exit 1
          }

          release_parent="$(git rev-parse "${PR_HEAD_SHA}^")"
          release_subject="$(git show -s --format=%s "$PR_HEAD_SHA")"
          base_tree="$(git show -s --format=%T "$PR_BASE_SHA")"
          source_tree="$(git show -s --format=%T "$source_sha")"
          merge_tree="$(git show -s --format=%T "$PR_MERGE_SHA")"
          [[ "$release_parent" == "$PR_BASE_SHA" ]] || {
            echo "::error::main release commit parent does not equal release base SHA"
            exit 1
          }
          [[ "$release_subject" == "release(${deployment_mode}): ${release_key}" ]] || {
            echo "::error::main release commit message does not match release key and deployment mode"
            exit 1
          }
          [[ "$source_tree" == "$base_tree" ]] || {
            echo "::error::main release commit tree differs from release base tree"
            exit 1
          }
          [[ "$merge_tree" == "$source_tree" ]] || {
            echo "::error::merge commit tree differs from main release tree"
            exit 1
          }

          {
            echo "release-key=${release_key}"
            echo "source-sha=${source_sha}"
            echo "deployment-mode=${deployment_mode}"
            echo "release-branch=${expected_base}"
          } >> "$GITHUB_OUTPUT"

          result="[release-pr] merged-and-verified release_key=${release_key} source_sha=${source_sha} deployment_mode=${deployment_mode} pr=${PR_NUMBER} merge_sha=${PR_MERGE_SHA} changed_files=0 deployment=triggered"
          echo "$result"
          {
            echo "## Release PR verification"
            echo "- Status: \`merged-and-verified\`"
            echo "- Release key: \`${release_key}\`"
            echo "- Source SHA: \`${source_sha}\`"
            echo "- Deployment mode: \`${deployment_mode}\`"
            echo "- PR: #${PR_NUMBER}"
            echo "- Merge SHA: \`${PR_MERGE_SHA}\`"
            echo "- Changed files: \`0\`"
            echo "- Deployment: \`triggered\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-release-applications:
    needs: verify-merged-empty-release-pr
    uses: ./.github/workflows/deploy_release_applications.yml
    with:
      source_sha: ${{ needs.verify-merged-empty-release-pr.outputs.source-sha }}
      release_key: ${{ needs.verify-merged-empty-release-pr.outputs.release-key }}
      deployment_mode: ${{ needs.verify-merged-empty-release-pr.outputs.deployment-mode }}
    secrets: inherit

  delete-release-branch:
    needs:
      - verify-merged-empty-release-pr
      - deploy-release-applications
    runs-on: ubuntu-latest
    steps:
      - name: delete one-time release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ needs.verify-merged-empty-release-pr.outputs.release-branch }}
        run: |
          set -euo pipefail
          encoded_branch="$(RELEASE_BRANCH="$RELEASE_BRANCH" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RELEASE_BRANCH"], safe=""))')"
          gh api -X DELETE "repos/${REPOSITORY}/git/refs/heads/${encoded_branch}"
          echo "[release-pr] deleted release_branch=${RELEASE_BRANCH}"
