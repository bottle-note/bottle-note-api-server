name: deploy release applications

# 운영 배포 단위는 통합 api 하나다(workspace#564). product·admin 단위와 backend/vX.Y.Z GitHub Release 경로는 2026.11.21에 정리했다.
on:
  workflow_call:
    inputs:
      source_sha:
        description: Fixed main source SHA to deploy
        required: true
        type: string
      release_key:
        description: Release key in YYYY-MM-DD/N format
        required: true
        type: string
      deployment_mode:
        description: Deployment unit (api)
        required: true
        type: string
      release_type:
        description: Release PR type (standard or hotfix)
        required: false
        default: standard
        type: string
      candidate_sha:
        description: Reviewed PR head SHA
        required: false
        default: ''
        type: string
      base_source_sha:
        description: Previously deployed Release PR source for a hotfix
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-backend-production-${{ inputs.release_key }}
  cancel-in-progress: false

env:
  API_IMAGE_NAME: bottlenote-api
  API_CHANNEL_TAG: api_latest_production

jobs:
  release-gate:
    name: gate backend release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      source-sha: ${{ steps.release.outputs.source-sha }}
      source-ref: ${{ steps.release.outputs.source-ref }}
      deployment-mode: ${{ steps.release.outputs.deployment-mode }}
      api-image-tag: ${{ steps.release.outputs.api-image-tag }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: validate release PR source
        id: release
        env:
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
          RELEASE_KEY_INPUT: ${{ inputs.release_key }}
          DEPLOYMENT_MODE_INPUT: ${{ inputs.deployment_mode }}
          RELEASE_TYPE_INPUT: ${{ inputs.release_type }}
          CANDIDATE_SHA_INPUT: ${{ inputs.candidate_sha }}
          BASE_SOURCE_SHA_INPUT: ${{ inputs.base_source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

          [[ "$SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full commit SHA"; exit 1; }
          [[ "$RELEASE_KEY_INPUT" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})/([1-9][0-9]*)$ ]] || { echo "::error::release_key must use YYYY-MM-DD/N format"; exit 1; }
          release_date="${BASH_REMATCH[1]}"
          sequence="${BASH_REMATCH[2]}"
          normalized_date="$(date -u -d "$release_date" +%F)" || { echo "::error::release_key contains an invalid calendar date"; exit 1; }
          [[ "$normalized_date" == "$release_date" ]] || { echo "::error::release_key contains an invalid calendar date"; exit 1; }
          [[ "$DEPLOYMENT_MODE_INPUT" == "api" ]] || { echo "::error::deployment_mode must be api"; exit 1; }

          source_sha="$SOURCE_SHA_INPUT"
          release_key="$RELEASE_KEY_INPUT"
          deployment_mode="$DEPLOYMENT_MODE_INPUT"
          release_type="${RELEASE_TYPE_INPUT:-standard}"
          git cat-file -e "${source_sha}^{commit}" || { echo "::error::source_sha is not available as a commit"; exit 1; }

          case "$release_type" in
            standard)
              [[ -z "$BASE_SOURCE_SHA_INPUT" ]] || {
                echo "::error::standard release must not provide base_source_sha"
                exit 1
              }
              git merge-base --is-ancestor "$source_sha" origin/main || {
                echo "::error::standard source_sha is not contained in origin/main: $source_sha"
                exit 1
              }
              source_ref="main"
              ;;
            hotfix)
              [[ "$CANDIDATE_SHA_INPUT" =~ ^[0-9a-f]{40}$ && "$BASE_SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::hotfix release requires candidate_sha and base_source_sha"
                exit 1
              }
              git cat-file -e "${CANDIDATE_SHA_INPUT}^{commit}"
              git cat-file -e "${BASE_SOURCE_SHA_INPUT}^{commit}"
              read -r merge_sha first_parent second_parent extra_parent <<< "$(git rev-list --parents -n 1 "$source_sha")"
              [[ "$merge_sha" == "$source_sha" && "$first_parent" == "$BASE_SOURCE_SHA_INPUT" && \
                 "$second_parent" == "$CANDIDATE_SHA_INPUT" && -z "${extra_parent:-}" ]] || {
                echo "::error::hotfix deployment source is not the verified base-plus-candidate merge"
                exit 1
              }
              source_ref="hotfixes/${release_key}"
              ;;
            *)
              echo "::error::release_type must be standard or hotfix"
              exit 1
              ;;
          esac

          version="${release_date//-/.}.${sequence}"
          api_image_tag="api_${version}"

          {
            echo "version=$version"
            echo "source-sha=$source_sha"
            echo "source-ref=$source_ref"
            echo "deployment-mode=$deployment_mode"
            echo "api-image-tag=$api_image_tag"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Backend Production Release Gate"
            echo "- Release key: \`${release_key}\`"
            echo "- Deployment mode: \`${deployment_mode}\`"
            echo "- Release type: \`${release_type}\`"
            echo "- Version: \`${version}\`"
            echo "- API image tag: \`${api_image_tag}\`"
            echo "- Source commit: \`${source_sha}\`"
            echo "- Source ref: \`${source_ref}\`"
            echo "- Main ancestry: \`passed\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "[backend-release-gate] passed release_key=$release_key deployment_mode=$deployment_mode version=$version source_sha=$source_sha"

  prepare-build:
    name: build api module
    needs: release-gate
    runs-on: ubuntu-24.04-arm
    outputs:
      api-module: ${{ steps.module.outputs.api-module }}
    steps:
      - name: checkout release source with submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-gate.outputs.source-sha }}
          submodules: true
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: setup gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 통합 앱 모듈은 bottlenote-product-api에서 bottlenote-api로 이름을 바꿨다.
      # 핫픽스는 이름을 바꾸기 전 운영 소스에서도 잘리므로 배포 소스에 있는 모듈 이름을 따른다.
      - name: resolve api module
        id: module
        run: |
          if [[ -d bottlenote-api ]]; then
            echo "api-module=bottlenote-api" >> "$GITHUB_OUTPUT"
          else
            echo "api-module=bottlenote-product-api" >> "$GITHUB_OUTPUT"
          fi

      - name: build api module
        env:
          API_MODULE: ${{ steps.module.outputs.api-module }}
        run: ./gradlew ":${API_MODULE}:build" -x test --build-cache

      - name: upload api jar
        uses: actions/upload-artifact@v7
        with:
          name: api-jar
          path: ${{ steps.module.outputs.api-module }}/build/libs/${{ steps.module.outputs.api-module }}.jar
          retention-days: 1

  build-api-image:
    name: build and push api image
    needs:
      - release-gate
      - prepare-build
    runs-on: ubuntu-24.04-arm
    outputs:
      image-digest: ${{ steps.build.outputs.image-digest }}
      promoted-tags: ${{ steps.build.outputs.promoted-tags }}
      previous-digest: ${{ steps.build.outputs.previous-digest }}
    steps:
      - name: checkout release source with submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-gate.outputs.source-sha }}
          submodules: true
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: refresh docker build action from main
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git checkout origin/main -- .github/actions/docker-build-push/action.yml

      - name: download api jar
        uses: actions/download-artifact@v8
        with:
          name: api-jar
          path: ${{ needs.prepare-build.outputs.api-module }}/build/libs/

      - name: build and push to registry
        id: build
        uses: ./.github/actions/docker-build-push
        with:
          registry-url: ${{ secrets.REGISTRY_ADDRESS }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          image-name: ${{ env.API_IMAGE_NAME }}
          image-tag: ${{ needs.release-gate.outputs.api-image-tag }}
          promote-tags: ${{ env.API_CHANNEL_TAG }}
          source-sha: ${{ needs.release-gate.outputs.source-sha }}
          source-ref: ${{ needs.release-gate.outputs.source-ref }}
          dockerfile: Dockerfile
          context: .
          platforms: linux/arm64
          cache-scope: api-production
          cache-export: 'false'
          image-title: "BottleNote API"
          image-description: "BottleNote API Server (product and admin API)"
          image-vendor: "BottleNote"
          image-authors: "BottleNote Team"
          sign-image: 'true'
          cosign-key-path: 'git.environment-variables/storage/docker-registry/cosign.key'
          cosign-public-key-path: 'git.environment-variables/storage/docker-registry/cosign.pub'
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

  image-updater-handoff:
    name: hand off release image to image updater
    needs:
      - release-gate
      - build-api-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: login to private registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_ADDRESS }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 승격된 채널 태그가 build job 이 서명·검증한 digest 를 가리키는지 독립적으로 재확인한다.
      - name: verify promoted channel digest
        env:
          REGISTRY: ${{ secrets.REGISTRY_ADDRESS }}
          VERSION: ${{ needs.release-gate.outputs.version }}
          SOURCE_SHA: ${{ needs.release-gate.outputs.source-sha }}
          API_IMAGE_TAG: ${{ needs.release-gate.outputs.api-image-tag }}
          API_IMAGE_DIGEST: ${{ needs.build-api-image.outputs.image-digest }}
          API_PROMOTED_TAGS: ${{ needs.build-api-image.outputs.promoted-tags }}
          API_PREVIOUS_DIGEST: ${{ needs.build-api-image.outputs.previous-digest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${API_IMAGE_NAME}"

          [[ "$API_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::build job did not report a valid image digest: ${API_IMAGE_DIGEST}"
            exit 1
          }
          [[ "$API_PROMOTED_TAGS" == "$API_CHANNEL_TAG" ]] || {
            echo "::error::build job promoted '${API_PROMOTED_TAGS}', expected '${API_CHANNEL_TAG}'"
            exit 1
          }
          channel_digest="$(docker buildx imagetools inspect "${image}:${API_CHANNEL_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$channel_digest" == "$API_IMAGE_DIGEST" ]] || {
            echo "::error::${API_CHANNEL_TAG} points to ${channel_digest}, expected ${API_IMAGE_DIGEST}"
            exit 1
          }
          echo "verified ${image}:${API_CHANNEL_TAG} -> ${API_IMAGE_DIGEST}"

          {
            echo "## Production image updater handoff"
            echo "- Version: \`${VERSION}\`"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- API image: \`${API_IMAGE_TAG}\`"
            echo "- API channel: \`${API_CHANNEL_TAG}\`"
            echo "- API digest: \`${API_IMAGE_DIGEST}\`"
            echo "- API previous digest: \`${API_PREVIOUS_DIGEST:-none}\`"
            echo "- API channel digest re-check: \`passed\`"
            echo "- GitOps update: \`Argo CD Image Updater\`"
          } >> "$GITHUB_STEP_SUMMARY"
