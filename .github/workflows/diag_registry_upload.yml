name: diag registry upload

# 수정한 docker-build-push action(BBR 적용)으로 실제 배포와 같은 build·push를 검증하는 일회성 진단. 이 브랜치 push에서만 실행한다
on:
  push:
    branches:
      - infra/registry-upload-diagnostic

permissions:
  contents: read

jobs:
  push-e2e:
    strategy:
      fail-fast: false
      matrix:
        probe: [ runner-a, runner-b, runner-c, runner-d ]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: runner identity
        run: |
          echo "public ip: $(curl -s --max-time 5 https://api.ipify.org || echo unknown)"

      - name: prepare probe image (unique 100MB layer)
        run: |
          head -c 100M /dev/urandom > probe.bin
          printf 'FROM alpine:3.20\nCOPY probe.bin /probe.bin\n' > Dockerfile.probe

      - name: build and push with docker-build-push
        uses: ./.github/actions/docker-build-push
        with:
          registry-url: ${{ secrets.REGISTRY_ADDRESS }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          image-name: diag-upload-probe
          image-tag: e2e-${{ github.run_id }}-${{ matrix.probe }}
          dockerfile: Dockerfile.probe
          context: .
          platforms: linux/arm64
          cache-export: 'false'

      - name: congestion control used by buildkit
        run: |
          builder=$(docker ps --filter name=buildx_buildkit --format '{{.Names}}' | head -n 1)
          echo "host: $(cat /proc/sys/net/ipv4/tcp_congestion_control)"
          echo "buildkit: $(docker exec "$builder" cat /proc/sys/net/ipv4/tcp_congestion_control)"
