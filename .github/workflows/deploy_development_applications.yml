name: deploy development applications

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "ci pipeline" ]
    types:
      - completed
    branches:
      - main

concurrency:
  group: "deploy-development"
  cancel-in-progress: true

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  prepare-build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04-arm
    outputs:
      source-sha: ${{ steps.versions.outputs.source-sha }}
      short-sha: ${{ steps.versions.outputs.short-sha }}
      product-image-tag: ${{ steps.versions.outputs.product-image-tag }}
      admin-image-tag: ${{ steps.versions.outputs.admin-image-tag }}
    steps:
      - name: checkout code with submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          submodules: true
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: setup gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: generate image tags
        id: versions
        run: |
          SHORT_SHA="${DEPLOY_SHA::7}"
          {
            echo "source-sha=$DEPLOY_SHA"
            echo "short-sha=$SHORT_SHA"
            echo "product-image-tag=product_${SHORT_SHA}"
            echo "admin-image-tag=admin_${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Commit SHA: $SHORT_SHA"

      - name: build both modules
        run: |
          ./gradlew :bottlenote-product-api:build :bottlenote-admin-api:build \
            -x test --build-cache --parallel

      - name: upload product jar
        uses: actions/upload-artifact@v7
        with:
          name: product-jar
          path: bottlenote-product-api/build/libs/bottlenote-product-api.jar
          retention-days: 1

      - name: upload admin jar
        uses: actions/upload-artifact@v7
        with:
          name: admin-jar
          path: bottlenote-admin-api/build/libs/bottlenote-admin-api.jar
          retention-days: 1

  build-product-image:
    needs: prepare-build
    runs-on: ubuntu-24.04-arm
    outputs:
      image-digest: ${{ steps.build.outputs.image-digest }}
    steps:
      - name: checkout code with submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          submodules: true
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: download product jar
        uses: actions/download-artifact@v8
        with:
          name: product-jar
          path: bottlenote-product-api/build/libs/

      - name: build and push to registry
        id: build
        uses: ./.github/actions/docker-build-push
        with:
          registry-url: ${{ secrets.REGISTRY_ADDRESS }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          image-name: bottlenote-product-api
          image-tag: ${{ needs.prepare-build.outputs.product-image-tag }}
          additional-tags: product_latest_development
          dockerfile: Dockerfile
          context: .
          platforms: linux/arm64
          cache-scope: product-development
          image-title: "BottleNote Product API"
          image-description: "BottleNote Product API Server (Development)"
          image-vendor: "BottleNote"
          image-authors: "BottleNote Team"
          sign-image: 'true'
          cosign-key-path: 'git.environment-variables/storage/docker-registry/cosign.key'
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

  build-admin-image:
    needs: prepare-build
    runs-on: ubuntu-24.04-arm
    outputs:
      image-digest: ${{ steps.build.outputs.image-digest }}
    steps:
      - name: checkout code with submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          submodules: true
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: download admin jar
        uses: actions/download-artifact@v8
        with:
          name: admin-jar
          path: bottlenote-admin-api/build/libs/

      - name: build and push to registry
        id: build
        uses: ./.github/actions/docker-build-push
        with:
          registry-url: ${{ secrets.REGISTRY_ADDRESS }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          image-name: bottlenote-admin-api
          image-tag: ${{ needs.prepare-build.outputs.admin-image-tag }}
          additional-tags: admin_latest_development
          dockerfile: Dockerfile-admin
          context: .
          platforms: linux/arm64
          cache-scope: admin-development
          image-title: "BottleNote Admin API"
          image-description: "BottleNote Admin API Server (Development)"
          image-vendor: "BottleNote"
          image-authors: "BottleNote Team"
          sign-image: 'true'
          cosign-key-path: 'git.environment-variables/storage/docker-registry/cosign.key'
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

  image-updater-handoff:
    needs: [prepare-build, build-product-image, build-admin-image]
    runs-on: ubuntu-latest
    steps:
      - name: summarize image updater handoff
        run: |
          {
            echo "## Development image updater handoff"
            echo "- Source SHA: ${{ needs.prepare-build.outputs.source-sha }}"
            echo "- Product image: ${{ needs.prepare-build.outputs.product-image-tag }}"
            echo "- Product digest: ${{ needs.build-product-image.outputs.image-digest }}"
            echo "- Admin image: ${{ needs.prepare-build.outputs.admin-image-tag }}"
            echo "- Admin digest: ${{ needs.build-admin-image.outputs.image-digest }}"
            echo "- GitOps update: Argo CD Image Updater (5 minute interval)"
          } >> "$GITHUB_STEP_SUMMARY"
