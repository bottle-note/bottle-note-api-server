name: deploy development applications

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "ci pipeline" ]
    types:
      - completed
    branches:
      - main

concurrency:
  group: "deploy-development"
  cancel-in-progress: true

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

# admin API를 흡수한 통합 앱(bottlenote-api 모듈 jar)을 이미지 bottlenote-api로 개발 api Deployment에 배포한다.
jobs:
  prepare-build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04-arm
    outputs:
      source-sha: ${{ steps.versions.outputs.source-sha }}
      short-sha: ${{ steps.versions.outputs.short-sha }}
      api-image-tag: ${{ steps.versions.outputs.api-image-tag }}
    steps:
      - name: checkout code with submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          submodules: true
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: setup gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: generate image tags
        id: versions
        run: |
          SHORT_SHA="${DEPLOY_SHA::7}"
          {
            echo "source-sha=$DEPLOY_SHA"
            echo "short-sha=$SHORT_SHA"
            echo "api-image-tag=api_${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Commit SHA: $SHORT_SHA"

      - name: build api module
        run: |
          ./gradlew :bottlenote-api:build -x test --build-cache

      - name: upload api jar
        uses: actions/upload-artifact@v7
        with:
          name: api-jar
          path: bottlenote-api/build/libs/bottlenote-api.jar
          retention-days: 1

  build-api-image:
    needs: prepare-build
    runs-on: ubuntu-24.04-arm
    outputs:
      image-digest: ${{ steps.build.outputs.image-digest }}
    steps:
      - name: checkout code with submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          submodules: true
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: download api jar
        uses: actions/download-artifact@v8
        with:
          name: api-jar
          path: bottlenote-api/build/libs/

      - name: build and push to registry
        id: build
        uses: ./.github/actions/docker-build-push
        with:
          registry-url: ${{ secrets.REGISTRY_ADDRESS }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          image-name: bottlenote-api
          image-tag: ${{ needs.prepare-build.outputs.api-image-tag }}
          promote-tags: api_latest_development
          source-sha: ${{ needs.prepare-build.outputs.source-sha }}
          source-ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          dockerfile: Dockerfile
          context: .
          platforms: linux/arm64
          cache-scope: api-development
          cache-export: 'true'
          image-title: "BottleNote API"
          image-description: "BottleNote API Server with Product and Admin APIs (Development)"
          image-vendor: "BottleNote"
          image-authors: "BottleNote Team"
          sign-image: 'true'
          cosign-key-path: 'git.environment-variables/storage/docker-registry/cosign.key'
          cosign-public-key-path: 'git.environment-variables/storage/docker-registry/cosign.pub'
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

  image-updater-handoff:
    needs: [prepare-build, build-api-image]
    runs-on: ubuntu-latest
    steps:
      - name: summarize image updater handoff
        run: |
          {
            echo "## Development image updater handoff"
            echo "- Source SHA: ${{ needs.prepare-build.outputs.source-sha }}"
            echo "- API image: bottlenote-api:${{ needs.prepare-build.outputs.api-image-tag }}"
            echo "- API channel tag: api_latest_development"
            echo "- API digest: ${{ needs.build-api-image.outputs.image-digest }}"
            echo "- Product/Admin images: not built (development product-api and admin-api stay on their current images)"
            echo "- GitOps update: Argo CD Image Updater (30 second interval)"
          } >> "$GITHUB_STEP_SUMMARY"
