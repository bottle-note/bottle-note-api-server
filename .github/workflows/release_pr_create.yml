name: release PR create

on:
  workflow_dispatch:
    inputs:
      release_date:
        description: Release date in YYYY-MM-DD format
        required: true
        type: string
      sequence:
        description: Positive release sequence number
        required: true
        type: string
      deployment_mode:
        description: Applications to deploy
        required: true
        default: both
        type: choice
        options:
          - both
          - product
          - admin
      release_type:
        description: standard creates releases/<key> from main with a release PR; hotfix creates hotfixes/<key> at the deployed production source
        required: false
        default: standard
        type: choice
        options:
          - standard
          - hotfix

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: release-pr-${{ inputs.release_date }}-${{ inputs.sequence }}
  cancel-in-progress: false

env:
  PRODUCT_IMAGE_NAME: bottlenote-product-api
  ADMIN_IMAGE_NAME: bottlenote-admin-api
  RELEASE_SERVICE: backend

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_DATE: ${{ inputs.release_date }}
      SEQUENCE: ${{ inputs.sequence }}
      DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      DISPATCH_REF: ${{ github.ref }}
    steps:
      - name: checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          persist-credentials: true

      - name: validate inputs and reserve release key
        id: reserve
        shell: bash
        env:
          REGISTRY_ADDRESS: ${{ secrets.REGISTRY_ADDRESS }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          [[ "$DISPATCH_REF" == "refs/heads/main" ]] || {
            echo "::error::workflow_dispatch must be run from refs/heads/main"
            exit 1
          }
          [[ "$RELEASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "::error::release_date must use YYYY-MM-DD format"
            exit 1
          }
          normalized_date="$(date -u -d "$RELEASE_DATE" +%F)" || {
            echo "::error::release_date is not a valid calendar date"
            exit 1
          }
          [[ "$normalized_date" == "$RELEASE_DATE" ]] || {
            echo "::error::release_date is not a valid calendar date"
            exit 1
          }
          [[ "$SEQUENCE" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::sequence must be a positive integer"
            exit 1
          }
          [[ "$RELEASE_TYPE" == "standard" || "$RELEASE_TYPE" == "hotfix" ]] || {
            echo "::error::release_type must be standard or hotfix"
            exit 1
          }
          [[ "$DEPLOYMENT_MODE" =~ ^(both|product|admin)$ ]] || {
            echo "::error::deployment_mode must be one of both, product, admin"
            exit 1
          }

          release_key="${RELEASE_DATE}/${SEQUENCE}"
          image_version="${RELEASE_DATE//-/.}.${SEQUENCE}"
          standard_branch="releases/${release_key}"
          hotfix_branch="hotfixes/${release_key}"

          # 배포 모드가 이번 릴리즈의 배포 단위를 정한다. 태그와 이미지는 단위마다 하나씩이다.
          case "$DEPLOYMENT_MODE" in
            both) deployed_services="product admin" ;;
            product) deployed_services="product" ;;
            admin) deployed_services="admin" ;;
          esac

          url_encode() {
            python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["VALUE"], safe=""))'
          }

          require_missing_remote_ref() {
            local ref_name="$1"
            local encoded response
            encoded="$(VALUE="$ref_name" url_encode)"
            if response="$(gh api --include "repos/${REPOSITORY}/git/ref/heads/${encoded}" 2>&1)"; then
              echo "::error::remote ref already exists: ${ref_name}"
              exit 1
            fi
            if [[ "$response" != *" 404 "* ]]; then
              echo "::error::unable to confirm remote ref is absent: ${ref_name}"
              exit 1
            fi
          }

          # 배포 태그는 브랜치와 달리 삭제되지 않으므로 릴리즈 키 재사용의 최종 방어선이다.
          require_missing_deployed_tag() {
            local service="$1" key="$2"
            local tag_name encoded response
            tag_name="deployed/${service}/${key}"
            encoded="$(VALUE="$tag_name" url_encode)"
            if response="$(gh api --include "repos/${REPOSITORY}/git/ref/tags/${encoded}" 2>&1)"; then
              echo "::error::release key was already deployed: ${tag_name}"
              exit 1
            fi
            if [[ "$response" != *" 404 "* ]]; then
              echo "::error::unable to confirm deployed tag is absent: ${tag_name}"
              exit 1
            fi
          }

          # 표준과 핫픽스는 같은 릴리즈 키에서 같은 immutable 이미지 태그를 만든다.
          # 두 네임스페이스의 브랜치와 레지스트리 태그가 모두 비어 있어야 키를 예약할 수 있다.
          require_missing_remote_ref "$standard_branch"
          require_missing_remote_ref "$hotfix_branch"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_ADDRESS" \
            --username "$REGISTRY_USERNAME" --password-stdin
          manifest_error_log="${RUNNER_TEMP}/manifest-error.log"
          for service in $deployed_services; do
            require_missing_deployed_tag "$service" "$release_key"

            case "$service" in
              product) image_name="$PRODUCT_IMAGE_NAME" ;;
              admin) image_name="$ADMIN_IMAGE_NAME" ;;
            esac
            image="${REGISTRY_ADDRESS}/${image_name}:${service}_${image_version}"
            if docker manifest inspect "$image" >/dev/null 2>"$manifest_error_log"; then
              echo "::error::image tag already exists for release key ${release_key}: ${image}"
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|no such manifest|not found' "$manifest_error_log"; then
              cat "$manifest_error_log" >&2
              echo "::error::failed to verify whether image tag exists: ${image}"
              exit 1
            fi
          done

          release_branch="$standard_branch"
          [[ "$RELEASE_TYPE" != "hotfix" ]] || release_branch="$hotfix_branch"
          {
            echo "release-key=${release_key}"
            echo "image-version=${image_version}"
            echo "release-branch=${release_branch}"
            echo "deployed-services=${deployed_services}"
          } >> "$GITHUB_OUTPUT"

      - name: create standard release PR
        if: env.RELEASE_TYPE == 'standard'
        shell: bash
        env:
          RELEASE_KEY: ${{ steps.reserve.outputs.release-key }}
          RELEASE_BRANCH: ${{ steps.reserve.outputs.release-branch }}
        run: |
          set -euo pipefail

          release_key="$RELEASE_KEY"
          release_branch="$RELEASE_BRANCH"
          release_branch_pushed=false
          main_pushed=false
          created_pr_url=""
          body_file=""

          cleanup_body_file() {
            [[ -z "$body_file" ]] || rm -f "$body_file"
          }

          created_resources_failure() {
            local message="$1"
            echo "::error::${message}. Remote resources may already exist; automatic cleanup is disabled and manual cleanup is required."
            {
              echo "## Backend release PR validation failed"
              echo "- Reason: ${message}"
              echo "- Release branch push: \`${release_branch_pushed}\`"
              echo "- Main empty commit push: \`${main_pushed}\`"
              echo "- Created PR: ${created_pr_url:-unknown}"
              echo "- Base ref: \`${release_branch}\`"
              echo "- Head ref: \`main\`"
              echo "- Manual cleanup required: \`yes\`"
              echo "- Automatic cleanup: \`disabled\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          handle_partial_failure() {
            local status="$1"
            if [[ "$release_branch_pushed" == true || "$main_pushed" == true || -n "$created_pr_url" ]]; then
              created_resources_failure "workflow failed after creating remote resources (exit ${status})"
            fi
            exit "$status"
          }

          trap 'handle_partial_failure "$?"' ERR
          trap cleanup_body_file EXIT

          open_pr_count="$(gh api -X GET "repos/${REPOSITORY}/pulls" \
            -f state=open \
            -f base="$release_branch" \
            -f head="${REPOSITORY_OWNER}:main" \
            --jq 'length')" || {
              echo "::error::unable to check for an existing open PR"
              exit 1
            }
          [[ "$open_pr_count" == "0" ]] || {
            echo "::error::an open PR already exists for base=${release_branch} head=main"
            exit 1
          }

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          pre_release_sha="$(git rev-parse origin/main)"
          pre_release_tree="$(git show -s --format=%T "$pre_release_sha")"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B main "$pre_release_sha"
          git commit --allow-empty -m "release(${DEPLOYMENT_MODE}): ${release_key}"
          source_sha="$(git rev-parse HEAD)"

          git push origin "${pre_release_sha}:refs/heads/${release_branch}"
          release_branch_pushed=true
          git push origin "${source_sha}:refs/heads/main"
          main_pushed=true

          git fetch --no-tags origin \
            "+refs/heads/${release_branch}:refs/remotes/origin/${release_branch}" \
            '+refs/heads/main:refs/remotes/origin/main'
          remote_release_sha="$(git rev-parse "origin/${release_branch}")"
          remote_main_sha="$(git rev-parse origin/main)"
          remote_main_parent="$(git rev-parse "${remote_main_sha}^")"
          remote_main_tree="$(git show -s --format=%T "$remote_main_sha")"

          [[ "$remote_release_sha" == "$pre_release_sha" ]] || \
            created_resources_failure "release branch does not point to the pre-release main SHA"
          [[ "$remote_main_sha" == "$source_sha" ]] || \
            created_resources_failure "main does not point to the release empty commit"
          [[ "$remote_main_parent" == "$pre_release_sha" ]] || \
            created_resources_failure "release empty commit parent does not match the pre-release main SHA"
          [[ "$remote_main_tree" == "$pre_release_tree" ]] || \
            created_resources_failure "release empty commit tree differs from the pre-release main tree"

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          Backend release PR for ${release_key}.

          Source SHA: ${source_sha}
          Deployment mode: ${DEPLOYMENT_MODE}

          <!-- release-source-sha:${source_sha} -->
          <!-- release-key:${release_key} -->
          <!-- release-service:backend -->
          <!-- release-deployment-mode:${DEPLOYMENT_MODE} -->
          EOF

          created_pr_url="$(gh pr create \
            --base "$release_branch" \
            --head main \
            --title "release(${DEPLOYMENT_MODE}): ${release_key}" \
            --body-file "$body_file")"

          pr_json="$(gh pr view "$created_pr_url" --json number,url,baseRefName,headRefName,headRefOid,body)" || \
            created_resources_failure "unable to resolve created PR metadata"
          PR_JSON="$pr_json" EXPECTED_BASE="$release_branch" EXPECTED_SOURCE_SHA="$source_sha" \
            EXPECTED_RELEASE_KEY="$release_key" EXPECTED_DEPLOYMENT_MODE="$DEPLOYMENT_MODE" python3 - <<'PY' || \
            created_resources_failure "created PR metadata or body marker validation failed"
          import json
          import os
          import re
          import sys

          pr = json.loads(os.environ['PR_JSON'])
          body = pr.get('body') or ''
          errors = []
          if pr.get('baseRefName') != os.environ['EXPECTED_BASE']:
              errors.append('PR base ref does not match the release branch')
          if pr.get('headRefName') != 'main':
              errors.append('PR head ref must be main')
          if pr.get('headRefOid') != os.environ['EXPECTED_SOURCE_SHA']:
              errors.append('PR head SHA does not match the release commit')
          expected_markers = {
              'release-source-sha': os.environ['EXPECTED_SOURCE_SHA'],
              'release-key': os.environ['EXPECTED_RELEASE_KEY'],
              'release-service': 'backend',
              'release-deployment-mode': os.environ['EXPECTED_DEPLOYMENT_MODE'],
          }
          for name, expected in expected_markers.items():
              values = re.findall(rf'<!--\s*{name}:\s*(.*?)\s*-->', body)
              if values != [expected]:
                  errors.append(f'PR body {name} marker is missing or invalid')
          if errors:
              for error in errors:
                  print(f'::error::{error}', file=sys.stderr)
              sys.exit(1)
          PY

          {
            echo "## Backend release PR created"
            echo "- PR: ${created_pr_url}"
            echo "- Source SHA: \`${source_sha}\`"
            echo "- Base ref: \`${release_branch}\`"
            echo "- Head ref: \`main\`"
            echo "- Post-create validation: \`passed\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 핫픽스 릴리즈 브랜치는 직전 운영 배포 소스에서만 잘린다. 핫픽스 PR(hotfix/** -> hotfixes/<key>) 자체는
      # 사람이 만들고, 여기서 출력한 본문 마커를 PR 본문에 그대로 넣는다.
      - name: create hotfix release branch
        if: env.RELEASE_TYPE == 'hotfix'
        shell: bash
        env:
          RELEASE_KEY: ${{ steps.reserve.outputs.release-key }}
          RELEASE_BRANCH: ${{ steps.reserve.outputs.release-branch }}
          DEPLOYED_SERVICES: ${{ steps.reserve.outputs.deployed-services }}
        run: |
          set -euo pipefail

          release_key="$RELEASE_KEY"
          hotfix_branch="$RELEASE_BRANCH"

          # >>> common deployed tag lookup (keep byte-identical across all release workflows and repositories)
          # 직전 운영 배포 소스는 deployed 태그가 보관한다. run 이력이 아니라 태그가 단일 기준이다.
          latest_deployed_key() {
            local service="$1" refs
            refs="$(gh api --paginate --slurp "repos/${REPOSITORY}/git/matching-refs/tags/deployed/${service}/")"
            MATCHING_REFS="$refs" DEPLOYED_SERVICE="$service" python3 - <<'PY'
          import json
          import os
          import re
          import sys

          pages = json.loads(os.environ['MATCHING_REFS'])
          service = re.escape(os.environ['DEPLOYED_SERVICE'])
          pattern = re.compile(rf'^refs/tags/deployed/{service}/(\d{{4}}-\d{{2}}-\d{{2}})/([1-9]\d*)$')
          keys = []
          for page in pages:
              for item in page:
                  matched = pattern.match(item.get('ref') or '')
                  if matched:
                      keys.append(((matched.group(1), int(matched.group(2))),
                                   f'{matched.group(1)}/{matched.group(2)}'))
          if not keys:
              print(f'::error::no deployed tag exists for {os.environ["DEPLOYED_SERVICE"]} yet', file=sys.stderr)
              sys.exit(1)
          keys.sort()
          print(keys[-1][1])
          PY
          }

          resolve_deployed_sha() {
            local service="$1" key="$2"
            local tag encoded ref_json object_type object_sha resolved
            tag="deployed/${service}/${key}"
            encoded="$(VALUE="$tag" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["VALUE"], safe=""))')"
            ref_json="$(gh api "repos/${REPOSITORY}/git/ref/tags/${encoded}")"
            read -r object_type object_sha <<< "$(REF_JSON="$ref_json" python3 -c '
          import json, os
          obj = json.loads(os.environ["REF_JSON"]).get("object") or {}
          print(obj.get("type") or "-", obj.get("sha") or "-")
          ')"
            resolved="$object_sha"
            [[ "$object_type" != "tag" ]] || \
              resolved="$(gh api "repos/${REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha')"
            [[ "$resolved" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::deployed tag ${tag} does not resolve to a commit SHA" >&2
              return 1
            }
            printf '%s' "$resolved"
          }
          # <<< common deployed tag lookup

          # 배포 단위가 여럿이면 모두 같은 릴리즈에서 같은 소스로 나가 있어야 핫픽스 base 가 하나로 정해진다.
          base_key=""
          base_source_sha=""
          base_tag=""
          for service in $DEPLOYED_SERVICES; do
            service_key="$(latest_deployed_key "$service")"
            service_sha="$(resolve_deployed_sha "$service" "$service_key")"
            if [[ -z "$base_key" ]]; then
              base_key="$service_key"
              base_source_sha="$service_sha"
              base_tag="deployed/${service}/${service_key}"
              continue
            fi
            [[ "$service_key" == "$base_key" && "$service_sha" == "$base_source_sha" ]] || {
              echo "::error::deploy units disagree on the latest release: ${service} is at ${service_key} (${service_sha}), expected ${base_key} (${base_source_sha})"
              exit 1
            }
            base_tag="${base_tag}, deployed/${service}/${service_key}"
          done
          [[ "$base_key" != "$release_key" ]] || {
            echo "::error::hotfix release key must differ from the deployed base release key: ${base_key}"
            exit 1
          }

          git fetch --no-tags origin "$base_source_sha"
          git cat-file -e "${base_source_sha}^{commit}"
          # 정보성 경고(대안 A 생성 가드): 운영 소스 스냅샷에 pull_request 트리거가 남아 있어도
          # hotfixes/** 네임스페이스는 그 스냅샷의 releases/** 필터에 걸리지 않는다.
          if git show "${base_source_sha}:.github/workflows/release_pr_merged.yml" 2>/dev/null | grep -Eq '^  pull_request:'; then
            echo "::warning::production source ${base_source_sha} still carries an on.pull_request release workflow snapshot; hotfixes/** is filtered out of it"
          fi

          git push origin "${base_source_sha}:refs/heads/${hotfix_branch}"
          git fetch --no-tags origin "+refs/heads/${hotfix_branch}:refs/remotes/origin/${hotfix_branch}"
          remote_hotfix_sha="$(git rev-parse "origin/${hotfix_branch}")"
          [[ "$remote_hotfix_sha" == "$base_source_sha" ]] || {
            echo "::error::hotfix branch ${hotfix_branch} does not point to the deployed production source ${base_source_sha}. Manual cleanup is required."
            exit 1
          }

          {
            echo "## Backend hotfix release branch created"
            echo "- Release key: \`${release_key}\`"
            echo "- Hotfix base ref: \`${hotfix_branch}\` at \`${base_source_sha}\`"
            echo "- Base release: \`${base_key}\` (tag \`${base_tag}\`)"
            echo "- Next: open a PR from \`hotfix/<name>\` to \`${hotfix_branch}\` and paste the markers below into the PR body"
            echo "- Replace \`<reviewed-head-sha>\` with the final reviewed PR head SHA before merging"
            echo
            echo '```'
            echo "<!-- release-source-sha:<reviewed-head-sha> -->"
            echo "<!-- release-key:${release_key} -->"
            echo "<!-- release-service:backend -->"
            echo "<!-- release-deployment-mode:${DEPLOYMENT_MODE} -->"
            echo "<!-- release-type:hotfix -->"
            echo "<!-- release-base-key:${base_key} -->"
            echo "<!-- release-base-source-sha:${base_source_sha} -->"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
