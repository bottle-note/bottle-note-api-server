<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 503" width="1120" height="503" role="img" aria-labelledby="contentWide-title contentWide-desc" lang="ko">
<title id="contentWide-title">캠페인 통계의 코어와 어댑터</title>
<desc id="contentWide-desc">Admin API가 content의 캠페인 지표 조회를 호출한다. content는 기간과 도달률을 결정하고 analytics에서 활성 회원 수와 제외 기준을 얻는다. JDBC 어댑터는 content가 정의한 집계 포트를 구현한다.</desc>
