<text x="787" y="143" class="type" text-anchor="start">JpaResourceLogRepository</text>
<text x="787" y="169" class="note" text-anchor="start">MySQL에 이미지 생성 기록을 저장합니다.</text>
<text x="923" y="286" class="tag" text-anchor="end">구현</text>
<rect x="534" y="270" width="314" height="66" rx="9" fill="#fcf0d8" stroke="#be8c50"/>
<text x="548" y="289" class="port-label" text-anchor="start">출력 포트</text>
<text x="548" y="309" class="port-name" text-anchor="start">ResourceLogRepository</text>
<text x="548" y="327" class="port-method" text-anchor="start">save()</text>
<rect x="334" y="430" width="420" height="58" rx="9" fill="#eef2e8" stroke="#c3d0bd"/>
<text x="352" y="455" class="peer-name" text-anchor="start">storage → user</text>
<text x="352" y="477" class="peer-note" text-anchor="start">업로드 기록에 남길 로그인 회원 ID</text>
