.core-mod {fill:#c7e6c8;font-size:22px;font-family:Inter,Arial,sans-serif;font-weight:600}
.core-name {fill:#fffaf1;font-size:35px;font-weight:750;letter-spacing:-1.2px}
.core-service {fill:#e2ece4;font-size:16px;font-family:Inter,Arial,sans-serif}
.core-rule {fill:#e8f1df;font-size:18px;font-weight:550}
.port-label {font-size:14px;fill:#88501e;font-weight:720}
.port-name {font-family:Inter,Arial,sans-serif;font-size:16px;fill:#492f19;font-weight:650}
.port-method {font-family:Inter,Arial,sans-serif;font-size:14px;fill:#7b512d}
.link {fill:none;stroke:#5b7268;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.copper {stroke:#a96736}
.peer-name {font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:730}
.peer-note {font-size:16px;fill:#3e5851}
.peer-type {font-family:Inter,Arial,sans-serif;font-size:14px;fill:#4b6258}
.icon {fill:none;stroke:#526c60;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
<marker id="storageWide-code" viewBox="0 0 9 10" refX="8" refY="5" markerWidth="7" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" stroke="#5b7268" stroke-width="1.6" fill="none"/></marker>
<marker id="storageWide-impl" viewBox="0 0 9 10" refX="8" refY="5" markerWidth="7" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" stroke="#a96736" stroke-width="1.6" fill="none"/></marker>
