<text x="94" y="236" class="type" text-anchor="start">saveImageResourceCreated()</text>
<text x="539" y="114" class="core-mod" text-anchor="middle">storage · 업무 코어</text>
<text x="539" y="164" class="core-name" text-anchor="middle">이미지 업로드 기록</text>
<text x="539" y="194" class="core-service" text-anchor="middle">ResourceCommandService</text>
<path d="M490 215 H588" class="link"/>
