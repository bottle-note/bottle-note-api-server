<text x="78" y="97" class="kicker" text-anchor="start">Product API가 호출하는 서비스</text>
<text x="38" y="140" class="outer-title" text-anchor="start">이미지 URL 발급</text>
<text x="38" y="165" class="type" text-anchor="start">ImageUploadService</text>
<text x="38" y="189" class="note" text-anchor="start">S3 SDK로 서명 URL을 만듭니다.</text>
