<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 503" width="1120" height="503" role="img" aria-labelledby="storageWide-title storageWide-desc" lang="ko">
<title id="storageWide-title">이미지 업로드 기록의 코어와 어댑터</title>
<desc id="storageWide-desc">Product API가 부른 ImageUploadService는 user에서 로그인한 회원 ID를 얻었을 때 storage의 ResourceCommandService에 기록을 맡긴다. Spring Data JPA 어댑터는 storage가 정의한 저장 포트를 구현한다.</desc>
<defs><style>
text {font-family:Inter,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#192e2a}
.kicker {font-size:17px;font-weight:650;fill:#536665}
.outer-title {font-size:29px;font-weight:720;letter-spacing:-.8px}
.type {font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-size:15px;fill:#3e5654}
.note {font-size:16px;fill:#405853}
