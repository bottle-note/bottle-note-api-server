<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="549" viewBox="0 0 1080 549" role="img" aria-labelledby="domain-network-title domain-network-desc" lang="ko">
  <title id="domain-network-title">BottleNote 업무 모듈 간 직접 의존</title>
  <desc id="domain-network-desc">10개 업무 모듈 사이의 17개 직접 의존을 모두 표시한다. storage가 user의 인증 사용자 ID를 사용하고 content가 analytics의 활성 회원 수와 방문자 제외 기준을 사용하는 두 관계를 주황색으로 강조했다.</desc>
  <defs>
    <style>
      text { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif; fill: #243e34; }
      .heading { font-size: 31px; font-weight: 730; }
      .detail { font-size: 17px; fill: #455c50; }
      .module { font-family: Inter,'Helvetica Neue',Arial,sans-serif; font-size: 22px; font-weight: 650; }
      .role { font-size: 16px; fill: #4b6556; }
      .label { font-size: 16px; fill: #89451e; }
      .node { fill: #e5eee3; stroke: #a9bca9; stroke-width: 1.3; }
      .wire,.arrow { fill: none; stroke: #557367; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .halo { fill: none; stroke: #faf9f3; stroke-width: 8; stroke-linecap: round; }
      .highlight { stroke: #9b4f23; stroke-width: 2.8; }
    </style>
  </defs>
  <rect width="1080" height="549" rx="14" fill="#faf9f3"/>
  <text x="32" y="48" class="heading">업무 모듈 간 직접 의존</text>
  <text x="1046" y="47" text-anchor="end" class="detail">10개 모듈 · 17개 관계</text>
  <text x="33" y="79" class="detail">화살표의 시작은 사용하는 모듈, 끝은 코드나 이벤트 타입을 제공하는 모듈입니다.</text>
  <g data-from="access-control" data-to="user">
